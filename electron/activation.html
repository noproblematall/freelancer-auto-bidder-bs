<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
    <title>Activate BidPilot</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root { color-scheme: dark; }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #12151b;
        color: #cbd5e1;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        -webkit-user-select: none;
        user-select: none;
      }
      .card { width: 100%; max-width: 460px; text-align: center; }
      .mark { width: 56px; height: 56px; margin: 0 auto 18px; }
      h1 { color: #fff; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
      p.sub { margin-top: 10px; color: #94a3b8; font-size: 0.92rem; line-height: 1.6; }
      form { margin-top: 24px; text-align: left; }
      label { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: #94a3b8; margin-bottom: 8px; }
      .device {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 14px; border-radius: 12px; border: 1px solid #334e68; background: #1a2029;
      }
      .device code {
        flex: 1; color: #fff; font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 1.15rem; letter-spacing: 0.08em; text-align: center;
        -webkit-user-select: text; user-select: text;
      }
      .device button {
        width: auto; margin: 0; padding: 8px 12px; font-size: 0.8rem; border-radius: 8px;
        background: #232a35; color: #cbd5e1; font-weight: 600;
      }
      .device button:hover:not(:disabled) { background: #2c3542; }
      .hint { margin-top: 8px; font-size: 0.8rem; color: #64748b; line-height: 1.5; }
      .field { margin-top: 20px; }
      textarea {
        width: 100%; min-height: 96px; padding: 12px 14px; border-radius: 12px; resize: vertical;
        border: 1px solid #334e68; background: #1a2029; color: #fff;
        font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.78rem; line-height: 1.45;
        word-break: break-all;
        -webkit-user-select: text; user-select: text;
      }
      textarea:focus { outline: 2px solid #34d399; outline-offset: 2px; border-color: #34d399; }
      .actions { display: flex; gap: 10px; margin-top: 14px; }
      button {
        width: 100%; padding: 14px 16px; border: none; border-radius: 12px;
        background: #10b981; color: #0b3b2e; font-weight: 700; font-size: 0.98rem; cursor: pointer;
        transition: background 0.15s;
      }
      button:hover:not(:disabled) { background: #34d399; }
      button:disabled { opacity: 0.6; cursor: default; }
      button.ghost { background: transparent; border: 1px solid #334e68; color: #cbd5e1; font-weight: 600; }
      button.ghost:hover:not(:disabled) { background: #1a2029; border-color: #34d399; color: #fff; }
      .msg { margin-top: 16px; font-size: 0.86rem; line-height: 1.5; min-height: 1.2em; text-align: center; }
      .msg.err { color: #fca5a5; }
      .msg.ok { color: #34d399; }
      .links { margin-top: 22px; font-size: 0.8rem; color: #64748b; line-height: 1.8; }
      .links a { color: #34d399; text-decoration: none; cursor: pointer; }
      .links a:hover { text-decoration: underline; }
      .dragbar { position: fixed; top: 0; left: 0; right: 0; height: 32px; -webkit-app-region: drag; }
    </style>
  </head>
  <body>
    <div class="dragbar"></div>
    <main class="card">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 7l7 4v6c0 4.2-2.9 7-7 8-4.1-1-7-3.8-7-8v-6l7-4z" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round" />
        <path d="M12.5 16.2l2.6 2.6 4.6-5.2" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1>Activate BidPilot</h1>
      <p class="sub">Send the device number below to get a license key for this computer, then paste the key or load the key file.</p>

      <form id="form" autocomplete="off">
        <label>Device number</label>
        <div class="device">
          <code id="device">…</code>
          <button id="copy" type="button">Copy</button>
        </div>
        <p class="hint">A key only works on the device it was generated for.</p>

        <div class="field">
          <label for="key">License key</label>
          <textarea id="key" name="key" placeholder="GROWL1.…" spellcheck="false"></textarea>
        </div>
        <div class="actions">
          <button id="load" class="ghost" type="button">Load key file…</button>
          <button id="btn" type="submit">Activate</button>
        </div>
        <div class="msg" id="msg"></div>
      </form>

      <p class="links">Need help? <a id="support">support@growlance.app</a></p>
    </main>

    <script>
      var form = document.getElementById('form')
      var input = document.getElementById('key')
      var btn = document.getElementById('btn')
      var loadBtn = document.getElementById('load')
      var copyBtn = document.getElementById('copy')
      var deviceEl = document.getElementById('device')
      var msg = document.getElementById('msg')
      var deviceNumber = ''

      function show(text, cls) {
        msg.className = 'msg ' + (cls || '')
        msg.textContent = text || ''
      }

      function setBusy(busy) {
        btn.disabled = busy
        loadBtn.disabled = busy
        input.disabled = busy
      }

      window.electron.license.deviceNumber().then(function (n) {
        deviceNumber = n || ''
        deviceEl.textContent = deviceNumber || 'unavailable'
      }).catch(function () {
        deviceEl.textContent = 'unavailable'
      })

      copyBtn.addEventListener('click', function () {
        if (!deviceNumber) return
        navigator.clipboard.writeText(deviceNumber).then(function () {
          copyBtn.textContent = 'Copied'
          setTimeout(function () { copyBtn.textContent = 'Copy' }, 1500)
        }).catch(function () {
          show('Could not copy. Select the number and copy it by hand.', 'err')
        })
      })

      loadBtn.addEventListener('click', async function () {
        try {
          var r = await window.electron.license.pickKeyFile()
          if (r && r.content) {
            input.value = r.content
            show('Key file loaded. Click Activate.', 'ok')
          } else if (r && r.error) {
            show('Could not read that file: ' + r.error, 'err')
          }
        } catch (e) {
          show('Could not open the file picker.', 'err')
        }
      })

      form.addEventListener('submit', async function (e) {
        e.preventDefault()
        var key = input.value.trim()
        if (!key) {
          show('Paste your license key or load the key file.', 'err')
          return
        }
        setBusy(true)
        show('Checking the key…')
        try {
          var res = await window.electron.license.activate(key)
          if (res && res.ok) {
            show('Activated! Restarting BidPilot…', 'ok')
            setTimeout(function () { window.electron.app.relaunch() }, 1200)
          } else {
            setBusy(false)
            show((res && res.message) || 'Activation failed. Please try again.', 'err')
          }
        } catch (e) {
          setBusy(false)
          show('Something went wrong. Please try again, or contact support@growlance.app.', 'err')
        }
      })

      document.getElementById('support').addEventListener('click', function () {
        window.electron.app.openExternal('mailto:support@growlance.app')
      })

      input.focus()
    </script>
  </body>
</html>

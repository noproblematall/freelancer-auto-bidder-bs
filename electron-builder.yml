appId: com.growlance.app
productName: BidPilot
copyright: Copyright © 2026 BidPilot

directories:
  output: dist/electron

# Where installed apps look for updates (electron/updater.js) and where
# `npm run release:win` uploads the installer + latest.yml. The repository is
# public, so installed apps need no token to check it.
publish:
  provider: github
  owner: noproblematall
  repo: freelancer-auto-bidder-bs
  releaseType: release

afterPack: electron/afterPack.js

# Files to include in the app bundle
files:
  - electron/**
  - backend/src/**
  - backend/prisma/schema.prisma
  # Seeder: required by auth.routes.js to give new accounts their default job filters
  - backend/prisma/seed.js
  - node_modules/**
  - package.json

# Files that live outside app.asar (accessible as real filesystem paths)
extraResources:
  - from: backend/prisma/migrations
    to: migrations
  - from: frontend/dist
    to: frontend
  # growlance-prisma is generated by prisma generate and not in package.json,
  # so electron-builder's dependency pruning excludes it from the asar.
  # Ship it as an extraResource and load via NODE_PATH in main.js.
  - from: node_modules/growlance-prisma
    to: growlance-prisma
  # Default AI proposal prompt — loaded by promptLoader.js at runtime
  - from: ChatGPT-prompt.md
    to: ChatGPT-prompt.md
  # Tray icon (electron/tray.js): Windows loads the .ico, Linux the .png
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png

# Native binaries cannot run from inside an asar archive
asarUnpack:
  - "node_modules/better-sqlite3/**"

# Build targets
mac:
  category: public.app-category.productivity
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

win:
  target:
    - target: nsis
      arch: [x64]

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Utility

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

dmg:
  sign: false
